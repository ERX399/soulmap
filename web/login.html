<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16151a">
  <title>SoulMap 登录</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16151a;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif}.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(208,188,255,.14),transparent 34%),radial-gradient(circle at 80% 70%,rgba(234,221,255,.08),transparent 30%);pointer-events:none}.card{position:relative;width:min(420px,calc(100vw - 32px));background:#211f26;border:1px solid #49454f;border-radius:18px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.45)}h1{margin:0;color:#d0bcff;font-size:26px}.sub{margin:8px 0 24px;color:#cac4d0;font-size:14px}.field{display:flex;gap:8px;align-items:center;background:#1c1b1f;border:1px solid #49454f;border-radius:14px;padding:0 12px}.field:focus-within{border-color:#d0bcff;box-shadow:0 0 0 1px #d0bcff}input{flex:1;min-width:0;background:transparent;color:#fff;border:0;padding:15px 0;font-size:16px;outline:0}button{cursor:pointer}.login{width:100%;margin-top:16px;border:0;border-radius:14px;padding:14px;background:#d0bcff;color:#381e72;font-weight:800;font-size:16px}.err{min-height:22px;margin-top:12px;color:#f2b8b5;font-size:14px}.hint{margin-top:18px;color:#938f99;font-size:12px;line-height:1.6}code{color:#eaddff}
  </style>
</head>
<body>
  <div class="bg"></div>
  <main class="card">
    <h1>SoulMap WebUI</h1>
    <div class="sub">请输入独立 WebUI 访问密码</div>
    <div class="field">
      <input id="p" name="password" type="password" autocomplete="current-password" placeholder="WebUI 密码" autofocus>
    </div>
    <button class="login" onclick="login()">登录</button>
    <div class="err" id="e"></div>
  </main>
<script>
async function login(){const password=document.getElementById('p').value;const e=document.getElementById('e');e.textContent='';const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(r.ok){location.href='/'}else{e.textContent='密码错误'}}
document.getElementById('p').addEventListener('keydown',ev=>{if(ev.key==='Enter')login()});
</script>
</body>
</html>
