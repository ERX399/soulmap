<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>SoulMap</title>
<style>
/* ===== Reset & Variables ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sf: #1c1b1f;
  --sf1: #211f26;
  --sf2: #2b2930;
  --sf3: #36343b;
  --on-sf: #e6e1e5;
  --on-sfv: #cac4d0;
  --outline: #938f99;
  --outlinev: #49454f;
  --pri: #d0bcff;
  --on-pri: #381e72;
  --pric: #4f378b;
  --on-pric: #eaddff;
  --sec-c: #4a4458;
  --err: #f2b8b5;
  --inv-sf: #e6e1e5;
  --inv-on-sf: #1c1b1f;
  --r-m: 12px;
  --r-l: 16px;
  --r-xl: 28px;
  --e1: 0 1px 3px 1px rgba(0,0,0,.15), 0 1px 2px rgba(0,0,0,.3);
  --e2: 0 2px 6px 2px rgba(0,0,0,.15), 0 1px 2px rgba(0,0,0,.3);
  --e3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  background: var(--sf);
  color: var(--on-sf);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ===== Icons (SVG inline, no CDN dependency) ===== */
.icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}
.icon svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* ===== Top App Bar ===== */
.topbar {
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--sf);
  border-bottom: 1px solid var(--outlinev);
}
.topbar h1 {
  font-size: 20px;
  font-weight: 500;
  letter-spacing: -0.3px;
}
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 20px;
  border: none;
  background: transparent;
  color: var(--on-sfv);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}
.icon-btn:hover { background: var(--sf3); }

/* ===== Navigation Tabs ===== */
.tabs {
  display: flex;
  background: var(--sf);
  border-bottom: 1px solid var(--outlinev);
}
.tab {
  flex: 1;
  padding: 12px 8px 10px;
  text-align: center;
  cursor: pointer;
  color: var(--on-sfv);
  font-size: 12px;
  font-weight: 500;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: color .15s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.tab::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 3px;
  background: var(--pri);
  border-radius: 3px 3px 0 0;
  transition: width .2s;
}
.tab.active { color: var(--pri); }
.tab.active::after { width: 48px; }

/* ===== Main Container ===== */
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 14px;
}

/* ===== Stats Cards ===== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--sf1);
  border-radius: 10px;
  padding: 12px 8px;
  text-align: center;
  border: 1px solid var(--outlinev);
}
.stat-card .v {
  font-size: 20px;
  font-weight: 700;
  color: var(--pri);
  line-height: 1.2;
}
.stat-card .l {
  font-size: 10px;
  color: var(--on-sfv);
  margin-top: 3px;
}

/* ===== Search Bar ===== */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--sf1);
  border: 1px solid var(--outlinev);
  border-radius: 20px;
  padding: 8px 14px;
  margin-bottom: 12px;
  transition: border-color .2s, box-shadow .2s;
}
.search-bar:focus-within {
  border-color: var(--pri);
  box-shadow: 0 0 0 1px var(--pri);
}
.search-bar input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--on-sf);
  font-size: 14px;
  font-family: inherit;
  outline: none;
}
.search-bar input::placeholder { color: var(--outline); }

.batch-clean {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: -4px 0 12px;
  padding: 10px;
  background: var(--sf1);
  border: 1px solid var(--outlinev);
  border-radius: 10px;
}
.batch-clean input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: var(--on-sf);
  font-size: 13px;
  font-family: inherit;
}
.batch-clean input::placeholder { color: var(--outline); }
.batch-clean button {
  border: 1px solid rgba(242,184,181,.45);
  background: rgba(242,184,181,.12);
  color: var(--err);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  -webkit-appearance: none;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s, border-color .15s, transform .1s;
  outline: none;
}
.batch-clean button:hover {
  background: rgba(242,184,181,.2);
  border-color: rgba(242,184,181,.6);
}
.batch-clean button:active { transform: scale(.96); }

.bulk-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
  margin: -4px 0 12px;
}
.bulk-actions button {
  border: 1px solid var(--outlinev);
  background: var(--sf1);
  color: var(--on-sfv);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  cursor: pointer;
  -webkit-appearance: none;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s, border-color .15s, transform .1s;
  outline: none;
}
.bulk-actions button:hover {
  background: var(--sf2);
  border-color: var(--outline);
}
.bulk-actions button:active {
  transform: scale(.96);
}
.bulk-actions button.danger {
  border-color: rgba(242,184,181,.45);
  background: rgba(242,184,181,.12);
  color: var(--err);
}
.bulk-actions button.danger:hover {
  background: rgba(242,184,181,.2);
  border-color: rgba(242,184,181,.6);
}
.bulk-actions button.danger:active {
  background: rgba(242,184,181,.25);
  transform: scale(.96);
}
.select-box {
  position: absolute;
  left: 8px;
  top: 8px;
  z-index: 2;
  display: none;
  width: 18px;
  height: 18px;
  accent-color: var(--pri);
}
.bulk-mode .select-box { display: block; }
.bulk-mode .card { padding-left: 34px; }
.star-btn {
  position: absolute;
  top: 8px;
  right: 44px;
  z-index: 2;
  display: none;
  background: transparent;
  border: none;
  font-size: 14px;
  cursor: pointer;
  opacity: 0.4;
  padding: 2px;
  line-height: 1;
}
.star-btn.starred { opacity: 1; display: block; }
.card:hover .star-btn { display: block; }



/* ===== User Cards Grid ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 8px;
}
.card {
  position: relative;
  background: var(--sf1);
  border: 1px solid var(--outlinev);
  border-radius: 10px;
  padding: 12px;
  padding-right: 70px;
  cursor: pointer;
  transition: background .12s, border-color .12s, transform .12s;
  -webkit-tap-highlight-color: transparent;
}
.card:hover {
  background: var(--sf2);
  border-color: var(--outline);
}
.card:active {
  transform: scale(0.98);
}
.card-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.card-info { flex: 1; min-width: 0; }
.card-name {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-sub {
  font-size: 10px;
  color: var(--outline);
  margin-top: 1px;
}
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  padding: 2px 7px;
  background: var(--sf3);
  border-radius: 5px;
  font-size: 10px;
  color: var(--on-sfv);
}
.platform-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  max-width: 58px;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(208,188,255,.16);
  border: 1px solid rgba(208,188,255,.34);
  color: var(--pri);
  font-size: 10px;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}

/* ===== Section Title ===== */
.section-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--on-sfv);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ===== Stats Bars ===== */
.bar-item { margin-bottom: 14px; }
.bar-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 5px;
}
.bar-name { font-size: 13px; font-weight: 500; }
.bar-val { font-size: 11px; color: var(--outline); }
.bar-track {
  height: 6px;
  background: var(--sf3);
  border-radius: 3px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--pri);
  border-radius: 3px;
  transition: width .4s ease-out;
}

/* ===== Dialog / Modal ===== */
.scrim {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn .15s;
}
.scrim.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.dialog {
  background: var(--sf2);
  border: 1px solid var(--outlinev);
  border-radius: 12px;
  width: 100%;
  max-width: 440px;
  max-height: 75vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--e3);
  animation: slideUp .2s ease-out;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.dialog-head {
  padding: 14px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--outlinev);
}
.dialog-head h2 {
  font-size: 16px;
  font-weight: 500;
}
.dialog-body {
  padding: 12px 16px;
  overflow-y: auto;
  flex: 1;
}
.dialog-acts {
  padding: 10px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-top: 1px solid var(--outlinev);
}

/* ===== Field List (Card Style) ===== */
.flist { 
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.fitem {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  background: var(--sf1);
  border: 1px solid var(--outlinev);
  border-radius: 8px;
  gap: 10px;
  transition: all .15s;
  min-height: 52px;
}
.fitem:hover { 
  background: var(--sf3);
  border-color: var(--outline);
}
.fitem-c { 
  flex: 1; 
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.fitem-l {
  font-size: 10px;
  color: var(--outline);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 3px;
  line-height: 1.2;
}
.fitem-v { 
  font-size: 13px;
  word-break: break-word;
  line-height: 1.4;
  color: var(--on-sf);
}

/* ===== Buttons (Material 3 pill) ===== */
.btn {
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
  background: transparent;
  color: inherit;
}
.btn-f { background: var(--pric); color: var(--on-pric); }
.btn-f:hover { box-shadow: var(--e1); opacity: .9; }
.btn-f:active { transform: scale(0.96); }
.btn-e { background: transparent; color: var(--err); border: 1px solid var(--err); }
.btn-e:hover { background: rgba(242,184,181,.1); }
.btn-e:active { transform: scale(0.96); }
.btn-sm { 
  padding: 6px 12px; 
  font-size: 11px; 
  border-radius: 16px; 
  min-height: 32px;
  min-width: 32px;
}
.btn-icon {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  padding: 6px;
  min-width: 32px;
  min-height: 32px;
  border-radius: 16px;
  flex-shrink: 0;
  border: 1px solid var(--outlinev);
  background: transparent !important;
  color: var(--on-sfv) !important;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-icon:hover { background: var(--sf3); border-color: var(--outline); }
.btn-del { color: var(--err); border-color: transparent; }
.btn-del:hover { background: rgba(242,184,181,.15); }
.btn-save { 
  background: var(--pric); 
  color: var(--on-pric); 
  border-color: var(--pric);
  font-weight: 700;
}
.btn-save:hover { opacity: 0.85; }
.btn-text {
  background: transparent;
  color: var(--on-sfv);
  border: none;
  padding: 10px 16px;
}
.btn-text:hover { background: var(--sf3); }

/* ===== Field Item Actions ===== */
.fitem-acts {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
  align-items: center;
}

/* ===== Inline Edit Input ===== */
 .fitem-edit {
   width: 100%;
   padding: 6px 8px;
   border-radius: 6px;
   border: 1px solid var(--pri);
   background: var(--sf);
   color: var(--on-sf);
   font-size: 13px;
   font-family: inherit;
   outline: none;
   box-shadow: 0 0 0 2px rgba(208,188,255,0.2);
 }

 /* 覆盖浏览器自动填充和选中文字样式，避免蓝底 */
 input:-webkit-autofill,
 input:-webkit-autofill:hover,
 input:-webkit-autofill:focus,
 input:-webkit-autofill:active {
   -webkit-box-shadow: 0 0 0 30px var(--sf) inset !important;
   -webkit-text-fill-color: var(--on-sf) !important;
   border: 1px solid var(--pri) !important;
 }
 .fitem-edit::selection {
   background: var(--pric);
   color: var(--on-pric);
 }

 /* ===== Add Field Section ===== */
.add-sec {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--outlinev);
}
.add-title {
  font-size: 11px;
  font-weight: 500;
  color: var(--outline);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.field-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}
.field-chip {
  padding: 6px 12px;
  border-radius: 16px;
  border: 1px solid var(--outlinev);
  background: var(--sf1);
  color: var(--on-sf);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
}
.field-chip:hover {
  background: var(--sf3);
  border-color: var(--pri);
  color: var(--pri);
}
.field-chip.used {
  background: var(--sf3);
  border-color: transparent;
  color: var(--outline);
  cursor: default;
  opacity: 0.6;
  pointer-events: none;
}
.selected-field {
  font-size: 12px;
  font-weight: 500;
  color: var(--pri);
  margin-bottom: 8px;
  padding: 6px 10px;
  background: var(--pric);
  color: var(--on-pric);
  border-radius: 6px;
  display: inline-block;
}
.add-row {
  display: flex;
  gap: 6px;
  align-items: stretch;
}
.md-inp {
  flex: 1;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--outline);
  background: var(--sf1);
  color: var(--on-sf);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color .15s;
  min-height: 40px;
}
.md-inp:focus { border-color: var(--pri); }

/* ===== Empty State ===== */
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--outline);
}
.empty .icon { width: 48px; height: 48px; margin: 0 auto 12px; color: var(--outlinev); }
.empty .icon svg { width: 48px; height: 48px; }
.empty p { font-size: 14px; }

/* ===== Snackbar ===== */
.snackbar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  padding: 12px 20px;
  border-radius: 8px;
  background: var(--sf2);
  color: var(--on-sf);
  font-size: 13px;
  box-shadow: var(--e3);
  opacity: 0;
  transition: all .25s cubic-bezier(.4,0,.2,1);
  z-index: 300;
  pointer-events: none;
}
.snackbar.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* ===== Confirm Dialog ===== */
#confirm-scrim {
  z-index: 400;
}
.confirm-box {
  max-width: 340px;
  padding: 18px;
  gap: 14px;
}
.confirm-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--on-sf);
}
.confirm-msg {
  font-size: 13px;
  color: var(--on-sfv);
  line-height: 1.5;
  word-break: break-word;
}
.confirm-acts {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* ===== Pagination Info ===== */
#pag-info {
  text-align: center;
  padding: 16px;
  font-size: 12px;
  color: var(--outline);
}

/* ===== Responsive: Tablet ===== */
@media (min-width: 601px) and (max-width: 1024px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}

/* ===== Responsive: Desktop ===== */
@media (min-width: 1025px) {
  .container { max-width: 1100px; padding: 28px 32px; }
  .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .topbar { padding: 14px 32px; }
  .tabs { padding: 0 32px; }
}

/* ===== Responsive: Mobile ===== */
@media (max-width: 600px) {
  .container { padding: 12px 10px; padding-bottom: 68px; }
  .grid { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .stat-card { padding: 10px 8px; }
  .stat-card .v { font-size: 18px; }
  .stat-card .l { font-size: 9px; }
  .topbar { padding: 10px 12px; }
  .topbar h1 { font-size: 16px; }
  .icon-btn { width: 36px; height: 36px; }

  /* Bottom nav */
  .tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--sf1);
    border-top: 1px solid var(--outlinev);
    border-bottom: none;
    padding-bottom: 0;
  }
  .tab { padding: 10px 6px 8px; font-size: 11px; }
  .tab .icon svg { width: 20px; height: 20px; }
  .tab::after { top: 0; bottom: auto; border-radius: 0 0 3px 3px; }

  /* Full-screen dialog */
  .scrim { padding: 0; align-items: flex-end; }
  .dialog {
    max-width: 100%;
    max-height: 88vh;
    border-radius: 14px 14px 0 0;
  }
  .dialog-body { padding: 10px 12px; }
  .dialog-head { padding: 10px 12px 8px; }
  .dialog-head h2 { font-size: 15px; }
  .dialog-acts { 
    padding: 10px 12px; 
    padding-bottom: 10px;
  }
  .add-row { 
    flex-wrap: wrap;
  }
  .add-row .md-inp { 
    flex: 1 1 100%;
    font-size: 15px;
    min-height: 44px;
  }
  .add-row .btn { 
    flex: 1;
    font-size: 14px;
    min-height: 44px;
  }
  .btn { min-height: 42px; font-size: 13px; }
  .btn-icon { min-width: 36px; min-height: 36px; }
  .field-chip { padding: 8px 14px; font-size: 13px; }
  .snackbar { bottom: 60px; max-width: calc(100vw - 32px); }
  
  /* 字段列表更紧凑，保留左右内边距防止溢出 */
  .fitem { padding: 10px 10px; }
  .fitem-l { font-size: 10px; }
  .fitem-v { font-size: 13px; }
  
  /* 卡片更紧凑 */
  .card { padding: 10px; padding-right: 66px; }
  .platform-badge { top: 7px; right: 7px; max-width: 54px; font-size: 9px; }
  .card-name { font-size: 13px; }
  .card-sub { font-size: 9px; }
  .chip { font-size: 9px; padding: 2px 6px; }
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--outlinev); border-radius: 3px; }
</style>
</head>
<body>

<header class="topbar">
  <h1>SoulMap</h1>
  <button class="icon-btn" onclick="refreshData()" title="刷新">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></span>
  </button>
</header>

<nav class="tabs">
  <div class="tab active" data-tab="overview" onclick="switchTab('overview')">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></span>
    <span>概览</span>
  </div>
  <div class="tab" data-tab="users" onclick="switchTab('users')">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></span>
    <span>用户</span>
  </div>
  <div class="tab" data-tab="stats" onclick="switchTab('stats')">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg></span>
    <span>统计</span>
  </div>
</nav>

<main class="container">
  <div id="tab-overview" class="tab-content">
    <div class="stats-row" id="ov-stats"></div>
    <div class="section-title">最近更新</div>
    <div class="grid" id="ov-recent"></div>
  </div>
  <div id="tab-users" class="tab-content" style="display:none">
    <div class="search-bar">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
      <input id="q" placeholder="搜索用户或内容..." oninput="filterUsers()">
    </div>
    <div class="batch-clean">
      <input id="batch-clean-keyword" placeholder="输入关键词">
      <button onclick="batchClean()">批量清理</button>
    </div>
    <div class="bulk-actions">
      <button onclick="toggleBulkMode()" id="bulk-toggle">选择画像卡</button>
      <button class="danger" onclick="batchDeleteCards()">删除选中 <span id="bulk-selected-count">0</span></button>
    </div>
    <div class="grid" id="ulist"></div>
  </div>
  <div id="tab-stats" class="tab-content" style="display:none">
    <div id="stats-c"></div>
  </div>
</main>

<div class="scrim" id="scrim" onclick="closeD(event)">
  <div class="dialog" onclick="event.stopPropagation()">
    <div class="dialog-head">
      <h2 id="dtitle">详情</h2>
      <button class="icon-btn" onclick="closeD()">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></span>
      </button>
    </div>
    <div class="dialog-body" id="dbody"></div>
    <div class="dialog-acts" id="dacts"></div>
  </div>
</div>

<div class="scrim" id="confirm-scrim">
  <div class="dialog confirm-box" onclick="event.stopPropagation()">
    <div class="confirm-title" id="confirm-title">确认操作</div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-acts">
      <button class="btn btn-text" id="confirm-cancel">取消</button>
      <button class="btn btn-e" id="confirm-ok">确认</button>
    </div>
  </div>
</div>

<div class="snackbar" id="snk"></div>
<script>window.soulmapWebuiDebug = __WEBUI_DEBUG__;</script>
<script src="/web/app.js"></script>
</body>
</html>
